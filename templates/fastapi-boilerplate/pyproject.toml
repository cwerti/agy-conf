[tool.poetry]
name = "fastapi-boilerplate"
version = "0.1.0"
description = "Production FastAPI template following culture_backend architecture"
authors = ["URIIT Developer"]
packages = [{ include = "app" }]

[tool.poe.tasks.lint]
help = "Ruff linter"
shell = "ruff check app tests"

[tool.poe.tasks.format]
help = "Ruff formatter"
shell = "ruff format app tests"

[tool.poe.tasks.isort]
help = "Sort imports"
shell = "ruff check --select I --fix app tests"

[tool.poe.tasks.code-check]
help = "Run format, isort, and lint"
sequence = ["format", "isort", "lint"]

[tool.poe.tasks.test]
help = "Run pytest suite"
shell = "pytest tests -v"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.110.0"
starlette = ">=0.36.0"
pydantic = ">=2.6.0"
pydantic-settings = ">=2.2.0"
sqlalchemy = ">=2.0.28"
asyncpg = ">=0.29.0"
alembic = ">=1.13.0"
httpx = ">=0.27.0"
redis = ">=5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
ruff = ">=0.3.0"
pyright = ">=1.1.350"
poethepoet = ">=0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
executionEnvironments = [{ root = "app" }]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
